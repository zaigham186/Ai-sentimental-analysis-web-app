<!DOCTYPE html>
<html>
<head>
    <title>API Direct Test</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        button { padding: 10px 20px; margin: 5px; background: #0070f3; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0051cc; }
        .result { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 5px; white-space: pre-wrap; font-family: monospace; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e9; color: #2e7d32; }
        h2 { color: #333; border-bottom: 2px solid #0070f3; padding-bottom: 10px; }
        .info { background: #e3f2fd; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 API Direct Test - Participant Count Checker</h1>
        
        <div class="info">
            <strong>Purpose:</strong> This tool directly tests your localhost backend to see how many participants it returns.
            This bypasses Next.js cache and shows you the REAL data from your backend.
        </div>

        <h2>Test Localhost Backend</h2>
        <button onclick="testLocalhost()">Test http://localhost:5000</button>
        
        <h2>Test Production Backend</h2>
        <button onclick="testProduction()">Test Railway Production</button>

        <h2>Compare Both</h2>
        <button onclick="compareBoth()">Compare Localhost vs Production</button>

        <div id="result" class="result" style="display:none;"></div>
    </div>

    <script>
        function showResult(html, isError = false) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = html;
            resultDiv.className = 'result ' + (isError ? 'error' : 'success');
            resultDiv.style.display = 'block';
        }

        async function testLocalhost() {
            showResult('Testing localhost backend...', false);
            
            try {
                const response = await fetch('http://localhost:5000/api/admin/participants/stats', {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                
                const html = `
<strong>✅ LOCALHOST BACKEND RESPONSE:</strong>

Total Participants: <strong style="font-size: 24px; color: #0070f3;">${data.data?.total || 'N/A'}</strong>

Full Response:
${JSON.stringify(data, null, 2)}

<strong>Conclusion:</strong>
Your localhost backend is returning ${data.data?.total || 0} participants.
If your frontend shows a different number, it's a FRONTEND CACHE issue.
                `;
                
                showResult(html, false);
            } catch (error) {
                showResult(`❌ ERROR testing localhost:\n\n${error.message}\n\nMake sure your backend is running: npm run dev`, true);
            }
        }

        async function testProduction() {
            showResult('Testing production backend...', false);
            
            try {
                const response = await fetch('https://ai-sentimental-analysis-web-app-production.up.railway.app/api/admin/participants/stats', {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                
                const html = `
<strong>✅ PRODUCTION BACKEND RESPONSE:</strong>

Total Participants: <strong style="font-size: 24px; color: #0070f3;">${data.data?.total || 'N/A'}</strong>

Full Response:
${JSON.stringify(data, null, 2)}

<strong>Conclusion:</strong>
Your production backend is returning ${data.data?.total || 0} participants.
                `;
                
                showResult(html, false);
            } catch (error) {
                showResult(`❌ ERROR testing production:\n\n${error.message}`, true);
            }
        }

        async function compareBoth() {
            showResult('Testing both backends...', false);
            
            try {
                // Test localhost
                const localhostResponse = await fetch('http://localhost:5000/api/admin/participants/stats', {
                    method: 'GET',
                    credentials: 'include'
                }).catch(e => null);

                const localhostData = localhostResponse ? await localhostResponse.json() : null;
                const localhostCount = localhostData?.data?.total || 'Backend not running';

                // Test production
                const productionResponse = await fetch('https://ai-sentimental-analysis-web-app-production.up.railway.app/api/admin/participants/stats', {
                    method: 'GET',
                    credentials: 'include'
                }).catch(e => null);

                const productionData = productionResponse ? await productionResponse.json() : null;
                const productionCount = productionData?.data?.total || 'Cannot connect';

                const match = localhostCount === productionCount;
                
                const html = `
<strong>📊 COMPARISON RESULTS:</strong>

Localhost Backend:  <strong style="font-size: 24px; color: ${typeof localhostCount === 'number' ? '#0070f3' : '#ff0000'};">${localhostCount}</strong>
Production Backend: <strong style="font-size: 24px; color: ${typeof productionCount === 'number' ? '#0070f3' : '#ff0000'};">${productionCount}</strong>

<strong>Status:</strong> ${match ? '✅ MATCH - Backends are synced!' : '❌ DIFFERENT - They are using different databases!'}

${!match ? `
<strong>⚠️ PROBLEM IDENTIFIED:</strong>

Your localhost and production are returning DIFFERENT participant counts!

This means:
1. They are connected to DIFFERENT MongoDB databases
   OR
2. Your localhost backend is not running (check terminal)
   OR  
3. Different MongoDB URI in Railway environment variables

<strong>SOLUTION:</strong>

Check Railway environment variables:
1. Go to Railway dashboard
2. Click on backend service
3. Go to Variables tab
4. Check MONGODB_URI value
5. Copy that EXACT value to your local backend/.env file
6. Restart your localhost backend

Then test again!
` : ''}

<strong>Localhost Response:</strong>
${localhostData ? JSON.stringify(localhostData, null, 2) : 'Backend not running'}

<strong>Production Response:</strong>
${productionData ? JSON.stringify(productionData, null, 2) : 'Cannot connect'}
                `;
                
                showResult(html, !match);
            } catch (error) {
                showResult(`❌ ERROR during comparison:\n\n${error.message}`, true);
            }
        }

        // Auto-run comparison on load
        window.onload = () => {
            setTimeout(compareBoth, 1000);
        };
    </script>
</body>
</html>
