# Nixpacks Configuration for Research NLP Service on Railway
# https://nixpacks.com/docs/configuration

[phases.setup]
nixPkgs = ["python310"]

[phases.install]
cmds = [
    "python -m venv --copies /opt/venv",
    ". /opt/venv/bin/activate && pip install --upgrade pip",
    ". /opt/venv/bin/activate && pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu",
    ". /opt/venv/bin/activate && pip install --no-cache-dir -r requirements.txt"
]

[start]
cmd = ". /opt/venv/bin/activate && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
