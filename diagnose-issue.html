<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnostic Tool - Registration Issue</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    .header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }
    .content {
      padding: 30px;
    }
    .test-section {
      margin-bottom: 30px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }
    .test-section h2 {
      color: #333;
      margin-bottom: 15px;
      font-size: 20px;
    }
    .status {
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 6px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status::before {
      content: '';
      width: 20px;
      height: 20px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .success::before {
      background: #28a745;
    }
    .error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .error::before {
      background: #dc3545;
    }
    .info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    .info::before {
      background: #17a2b8;
    }
    .warning {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeaa7;
    }
    .warning::before {
      background: #ffc107;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: transform 0.2s;
      margin: 5px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    button:active {
      transform: translateY(0);
    }
    button:disabled {
      background: #6c757d;
      cursor: not-allowed;
      transform: none;
    }
    pre {
      background: #282c34;
      color: #abb2bf;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 13px;
      margin-top: 10px;
      max-height: 300px;
      overflow-y: auto;
    }
    .code {
      font-family: 'Courier New', monospace;
      background: #f1f3f5;
      padding: 2px 6px;
      border-radius: 3px;
      color: #e83e8c;
    }
    .progress {
      margin: 20px 0;
    }
    .progress-bar {
      height: 6px;
      background: #e9ecef;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      width: 0%;
      transition: width 0.3s;
    }
    .recommendation {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
    }
    .recommendation h3 {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔍 Registration Issue Diagnostic Tool</h1>
      <p>Comprehensive testing to identify the problem</p>
    </div>
    
    <div class="content">
      <div class="test-section">
        <h2>Test 1: Backend Connectivity</h2>
        <button onclick="testBackend()">Test Backend Connection</button>
        <div id="backend-result"></div>
      </div>

      <div class="test-section">
        <h2>Test 2: Frontend Port Detection</h2>
        <button onclick="testFrontendPort()">Detect Frontend Port</button>
        <div id="frontend-result"></div>
      </div>

      <div class="test-section">
        <h2>Test 3: Cookie Support</h2>
        <button onclick="testCookies()">Test Cookie Handling</button>
        <div id="cookie-result"></div>
      </div>

      <div class="test-section">
        <h2>Test 4: Full Registration Flow</h2>
        <button onclick="testFullFlow()">Run Complete Test</button>
        <div class="progress" id="flow-progress" style="display:none;">
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
        <div id="flow-result"></div>
      </div>

      <div id="recommendations"></div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:5000';
    let testResults = {
      backend: false,
      cookies: false,
      registration: false,
      profile: false
    };

    function showStatus(elementId, message, type) {
      const element = document.getElementById(elementId);
      element.innerHTML += `<div class="status ${type}">${message}</div>`;
    }

    function showCode(elementId, data) {
      const element = document.getElementById(elementId);
      element.innerHTML += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
    }

    async function testBackend() {
      const resultDiv = document.getElementById('backend-result');
      resultDiv.innerHTML = '';
      
      showStatus('backend-result', '⏳ Testing backend connection...', 'info');
      
      try {
        const response = await fetch(`${API_URL}/api/health`, {
          method: 'GET',
          credentials: 'include'
        });
        
        const data = await response.json();
        
        if (response.ok) {
          testResults.backend = true;
          showStatus('backend-result', `✅ Backend is running on port 5000`, 'success');
          showStatus('backend-result', `Environment: ${data.environment} | Database: ${data.database}`, 'info');
        } else {
          showStatus('backend-result', '❌ Backend returned an error', 'error');
          showCode('backend-result', data);
        }
      } catch (error) {
        showStatus('backend-result', `❌ Cannot connect to backend: ${error.message}`, 'error');
        showStatus('backend-result', '💡 Make sure backend is running: cd backend && npm start', 'warning');
      }
    }

    async function testFrontendPort() {
      const resultDiv = document.getElementById('frontend-result');
      resultDiv.innerHTML = '';
      
      const currentPort = window.location.port || '80';
      const currentHost = window.location.hostname;
      
      showStatus('frontend-result', `📍 Current page location: ${window.location.href}`, 'info');
      showStatus('frontend-result', `🌐 Host: ${currentHost} | Port: ${currentPort}`, 'info');
      
      // Test both ports
      const portsToTest = ['3000', '3001'];
      
      for (const port of portsToTest) {
        try {
          const response = await fetch(`http://localhost:${port}`, {
            method: 'HEAD',
            mode: 'no-cors'
          });
          showStatus('frontend-result', `✅ Frontend accessible on port ${port}`, 'success');
        } catch (error) {
          showStatus('frontend-result', `⚠️ Port ${port} not accessible`, 'warning');
        }
      }
      
      if (currentPort !== '3000' && currentPort !== '3001') {
        showStatus('frontend-result', '⚠️ You opened this file directly. Frontend should be at http://localhost:3000 or http://localhost:3001', 'warning');
      }
    }

    async function testCookies() {
      const resultDiv = document.getElementById('cookie-result');
      resultDiv.innerHTML = '';
      
      showStatus('cookie-result', '🍪 Testing cookie support...', 'info');
      
      // Test if cookies are enabled
      document.cookie = 'test=1';
      if (document.cookie.indexOf('test=1') !== -1) {
        testResults.cookies = true;
        showStatus('cookie-result', '✅ Cookies are enabled in browser', 'success');
        document.cookie = 'test=; expires=Thu, 01 Jan 1970 00:00:00 UTC;';
      } else {
        showStatus('cookie-result', '❌ Cookies are disabled in browser', 'error');
        showStatus('cookie-result', '💡 Enable cookies in browser settings', 'warning');
        return;
      }
      
      // Test cross-origin cookie
      showStatus('cookie-result', '🔐 Testing cross-origin cookie handling...', 'info');
      
      try {
        const response = await fetch(`${API_URL}/api/health`, {
          method: 'GET',
          credentials: 'include'
        });
        
        if (response.ok) {
          showStatus('cookie-result', '✅ Cross-origin requests working (credentials: include)', 'success');
        }
      } catch (error) {
        showStatus('cookie-result', `⚠️ Cross-origin issue: ${error.message}`, 'warning');
      }
    }

    async function testFullFlow() {
      const resultDiv = document.getElementById('flow-result');
      const progressDiv = document.getElementById('flow-progress');
      const progressFill = document.getElementById('progress-fill');
      
      resultDiv.innerHTML = '';
      progressDiv.style.display = 'block';
      progressFill.style.width = '0%';
      
      const randomNum = Math.floor(Math.random() * 100000);
      const testUser = {
        name: 'Test User',
        username: `test${randomNum}`,
        age: 20,
        gender: 'male',
        university: 'SBBWU',
        department: 'Computer Science',
        condition: 'anonymous'
      };
      
      // Step 1: Register
      showStatus('flow-result', `⏳ Step 1/2: Registering user ${testUser.username}...`, 'info');
      progressFill.style.width = '25%';
      
      try {
        const regResponse = await fetch(`${API_URL}/api/participants/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(testUser)
        });
        
        progressFill.style.width = '50%';
        const regData = await regResponse.json();
        
        if (regResponse.status === 201) {
          testResults.registration = true;
          showStatus('flow-result', '✅ Registration successful!', 'success');
          showStatus('flow-result', `Username: ${regData.data.username} | Status: ${regData.data.status}`, 'info');
        } else {
          showStatus('flow-result', `❌ Registration failed: ${regData.message}`, 'error');
          if (regData.errors) {
            regData.errors.forEach(err => {
              showStatus('flow-result', `  ⚠️ ${err.message}`, 'warning');
            });
          }
          progressFill.style.width = '100%';
          return;
        }
        
        // Step 2: Get Profile
        showStatus('flow-result', '⏳ Step 2/2: Fetching profile...', 'info');
        progressFill.style.width = '75%';
        
        const profileResponse = await fetch(`${API_URL}/api/participants/me`, {
          method: 'GET',
          credentials: 'include'
        });
        
        const profileData = await profileResponse.json();
        progressFill.style.width = '100%';
        
        if (profileResponse.ok) {
          testResults.profile = true;
          showStatus('flow-result', '✅ Profile retrieved successfully!', 'success');
          showStatus('flow-result', `Name: ${profileData.data.name} | University: ${profileData.data.university}`, 'info');
          showStatus('flow-result', '🎉 ALL TESTS PASSED! Your system is working correctly!', 'success');
          
          showRecommendation('success');
        } else {
          showStatus('flow-result', `❌ Failed to get profile: ${profileData.message}`, 'error');
          if (profileResponse.status === 401) {
            showStatus('flow-result', '🔒 Session cookie not found or invalid', 'error');
            showStatus('flow-result', '💡 This usually means cookies are not being saved/sent properly', 'warning');
          }
          showRecommendation('profile-failed');
        }
        
      } catch (error) {
        progressFill.style.width = '100%';
        showStatus('flow-result', `❌ Test failed: ${error.message}`, 'error');
        showRecommendation('network-error');
      }
    }

    function showRecommendation(result) {
      const recommendDiv = document.getElementById('recommendations');
      
      if (result === 'success') {
        recommendDiv.innerHTML = `
          <div class="recommendation">
            <h3>✅ Diagnosis: Everything Works!</h3>
            <p><strong>Your backend and registration flow are working perfectly.</strong></p>
            <p>If you're still seeing "Loading..." in your Next.js app:</p>
            <ul style="margin: 10px 0 10px 20px;">
              <li>Make sure you're accessing the app at <code class="code">http://localhost:3001</code> (not 3000)</li>
              <li>Clear browser cache: Press <code class="code">Ctrl + Shift + R</code></li>
              <li>Delete cookies for localhost in Developer Tools (F12 → Application → Cookies)</li>
              <li>Restart Next.js: <code class="code">cd frontend && npm run dev</code></li>
            </ul>
          </div>
        `;
      } else if (result === 'profile-failed') {
        recommendDiv.innerHTML = `
          <div class="recommendation">
            <h3>⚠️ Diagnosis: Cookie Issue</h3>
            <p><strong>Registration works but session cookies aren't being handled properly.</strong></p>
            <p><strong>Solutions:</strong></p>
            <ul style="margin: 10px 0 10px 20px;">
              <li>Check if browser is blocking third-party cookies</li>
              <li>Make sure <code class="code">credentials: 'include'</code> is in frontend API calls</li>
              <li>Verify backend CORS allows credentials from port 3001</li>
              <li>Try accessing from <code class="code">http://localhost:3001</code> (same port as Next.js)</li>
            </ul>
          </div>
        `;
      } else if (result === 'network-error') {
        recommendDiv.innerHTML = `
          <div class="recommendation">
            <h3>❌ Diagnosis: Connection Issue</h3>
            <p><strong>Cannot connect to backend API.</strong></p>
            <p><strong>Solutions:</strong></p>
            <ul style="margin: 10px 0 10px 20px;">
              <li>Start backend: <code class="code">cd backend && npm start</code></li>
              <li>Verify it's running on port 5000</li>
              <li>Check firewall isn't blocking port 5000</li>
              <li>Verify MongoDB is connected</li>
            </ul>
          </div>
        `;
      }
    }

    // Auto-run backend test on load
    window.onload = () => {
      testBackend();
      testFrontendPort();
    };
  </script>
</body>
</html>
